<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>歌单工作室</title><link rel="stylesheet" href="style.css"><script src="app.js" defer></script><header><div><small>WILBURWIN / LOCAL MUSIC STUDIO</small><h1>歌单工作室</h1></div><div><button id="export">导出歌单</button><button id="publish">更新网站歌单</button></div></header><details><summary>导入文本与优先 UP 主设置</summary><div class="settings"><label>歌曲 - 歌手<textarea id="source" placeholder="每行一首；重新导入保留已有锁定结果"></textarea><input type="file" id="file" accept=".txt,text/plain"><button id="import">导入文本</button></label><label>优先 UP 主名称或 UID（每行一个，按优先级排序）<textarea id="preferred"></textarea><label>优先标题关键词（每行一个）<textarea id="titleKeywords" placeholder="Hi-res&#10;无损&#10;FLAC"></textarea></label><button id="save">保存设置</button><p>标题关键词会给候选增加排序权重；例如 Hi-res、无损、FLAC。手动锁定不被自动覆盖。</p></label></div></details><p id="status" role="status">读取本地项目…</p><main><aside><div class="filters"><input id="filter" placeholder="搜索歌曲或歌手"><label><input id="pending" type="checkbox">只看未确认</label></div><div id="songs"></div></aside><section><div id="heading"></div><div class="actions"><button id="search">读取候选 / 联网搜索</button><a id="web" target="_blank" rel="noreferrer">在 B站搜索 ↗</a></div><label class="refresh-option"><input id="refresh" type="checkbox">强制重新联网搜索已缓存歌曲</label><p class="search-note">首次搜索立即开始；之后每首间隔 12–20 秒。遇到 412 会自动停止并进入冷却期，不会连续重试。</p><form id="manual"><input id="bv" placeholder="粘贴 BV号或视频链接" required><input id="page" type="number" min="1" max="999" value="1" aria-label="分P"><button>手动锁定</button></form><div id="candidates"></div><iframe id="preview" title="候选视频试听" allow="fullscreen" hidden></iframe></section></main></html>
